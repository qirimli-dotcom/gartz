<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Стиральные машины — GARTZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--accent:#b24536;--accent-d:#9a3a2d;--ink:#2a2f3a;--muted:#7b828e;--line:#e7e9ee;--bg:#f4f5f7;--purple:#a12ba0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Open Sans',Arial,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;line-height:1.55}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1280px;margin:0 auto;padding:0 32px}
  /* header */
  header{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:24px;height:70px}
  .logo img{height:28px;width:auto;display:block;filter:invert(1)}
  nav{display:flex;gap:24px;margin-left:auto}
  nav a{font-size:15px;font-weight:600;color:#2a2f3a;transition:.18s}
  nav a:hover{color:var(--accent)}
  /* title band */
  .titleband{background:var(--bg);border-bottom:1px solid var(--line);padding:34px 0 30px}
  .crumbs{font-size:13px;color:var(--muted);margin-bottom:12px}
  .crumbs a:hover{color:var(--accent)}
  .titleband h1{font-family:'Montserrat',Arial,sans-serif;font-weight:800;font-size:clamp(26px,3.4vw,40px);letter-spacing:-.01em}
  .found{font-size:13px;color:var(--muted);margin-top:8px}
  /* layout */
  .layout{display:grid;grid-template-columns:250px 1fr;gap:34px;padding:36px 0 70px}
  @media(max-width:860px){.layout{grid-template-columns:1fr;gap:22px}}
  /* filters */
  .filters{align-self:start}
  .fgroup{border-bottom:1px solid var(--line);padding:16px 0}
  .fgroup:first-child{padding-top:0}
  .fgroup h4{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .fopt{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px;color:#41474f;cursor:pointer}
  .fopt input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
  .freset{margin-top:16px;font-size:13px;color:var(--accent);font-weight:700;background:none;border:none;cursor:pointer;padding:0}
  /* products */
  .pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-content:start}
  @media(max-width:1100px){.pgrid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:720px){.pgrid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:480px){.pgrid{grid-template-columns:1fr}}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
  .pcard:hover{box-shadow:0 16px 34px -20px rgba(30,34,45,.28);transform:translateY(-3px)}
  .pimg{aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:#cdd2da;background:#fbfbfc;border-radius:8px;margin-bottom:10px}
  .pimg img{max-width:100%;max-height:100%;object-fit:contain}
  .pimg svg{width:40%}
  .pname{font-size:13px;line-height:1.3;color:#2a2f3a;min-height:34px}
  .pcard:hover .pname{color:var(--accent)}
  .pprice{margin-top:8px;font-family:'Montserrat',Arial,sans-serif;font-weight:800;font-size:16px;color:var(--accent)}
  .empty{grid-column:1/-1;color:var(--muted);padding:40px 0;text-align:center}
  /* товар: кнопки над фото + модалка */
  .ptop{display:flex;gap:8px;margin-bottom:10px}
  .pbtn{flex:1;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.02em;padding:7px 6px;border:1px solid var(--line);background:#fff;color:#41474f;border-radius:7px;cursor:pointer;transition:.16s;text-transform:uppercase}
  .pbtn:hover{border-color:var(--accent);color:var(--accent)}
  .modal-ov{position:fixed;inset:0;background:rgba(24,26,30,.5);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow:auto}
  .modal-ov.open{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:720px;width:100%;padding:32px 34px;position:relative;box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
  .modal-x{position:absolute;top:20px;right:22px;background:none;border:none;color:var(--accent);font-size:22px;line-height:1;cursor:pointer}
  .modal h3{font-family:'Montserrat',Arial,sans-serif;font-weight:800;font-size:20px;margin-bottom:20px;padding-right:30px}
  .modal h4{font-size:14px;font-weight:700;margin:18px 0 10px}
  .modal h4:first-of-type{margin-top:0}
  .modal ul{list-style:none;padding:0}
  .modal li{font-size:14px;color:#41474f;padding:5px 0 5px 16px;position:relative}
  .modal li::before{content:"";position:absolute;left:0;top:12px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
  .modal li b{color:#2a2f3a;font-weight:600}
  .modal p{font-size:14px;color:#41474f;line-height:1.75;margin-bottom:12px}
  .pfoot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;flex-wrap:wrap}
  .pfoot .pprice{margin-top:0}
  .picons{display:flex;gap:5px}
  .picon{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#7b828e;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.16s;padding:0;flex:none}
  .picon:hover{border-color:var(--accent);color:var(--accent);background:#fff}
  .picon svg{width:13px;height:13px}
  /* ---- mobile ---- */
  .fbtn-m{display:none}
  @media(max-width:860px){
    nav{display:none}
    .fbtn-m{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink)}
    .filters{display:none}
    .filters.open{display:block;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:20px}
    .layout{display:block}
    .titleband{padding:26px 0 22px}
  }
  @media(max-width:520px){.pgrid{grid-template-columns:repeat(2,1fr);gap:12px}}
</style>
</head>

];

function money(n){return n.toLocaleString('ru-RU').replace(/,/g,'\u00A0')+'\u00A0₽'}

var filtersBox=document.getElementById('filters'),grid=document.getElementById('pgrid'),found=document.getElementById('found');
filtersBox.innerHTML=FCFG.map(function(g){
  return '<div class="fgroup"><h4>'+g.t+'</h4>'+g.o.map(function(o){
    return '<label class="fopt"><input type="checkbox" data-f="'+g.f+'" value="'+o+'">'+o+'</label>';
  }).join('')+'</div>';
}).join('')+'<button class="freset" id="freset">Сбросить фильтры</button>';

function render(){
  var checked={};
  filtersBox.querySelectorAll('input:checked').forEach(function(i){(checked[i.dataset.f]=checked[i.dataset.f]||[]).push(i.value)});
  var list=P.filter(function(pr){
    for(var f in checked){ if(checked[f].indexOf(String(pr[f]))<0) return false; }
    return true;
  });
  found.textContent='Найдено товаров: '+list.length;
  grid.innerHTML=list.length? list.map(function(pr){
    var mdl=modelOf(pr.n);return '<div class="pcard"><div class="pimg">'+WASH+'</div><div class="pname">'+pr.n+'</div><div class="pfoot"><span class="pprice">'+money(pr.p)+'</span><div class="picons"><button class="picon" title="Описание" data-desc="'+mdl+'">'+ICO_DESC+'</button><button class="picon" title="Характеристики" data-spec="'+mdl+'">'+ICO_SPEC+'</button><button class="picon" title="Комплектация" data-kit="'+mdl+'">'+ICO_KIT+'</button></div></div></div>';
  }).join('') : '<div class="empty">По выбранным фильтрам ничего не найдено</div>';
}
filtersBox.addEventListener('change',render);
document.getElementById('freset').addEventListener('click',function(){
  filtersBox.querySelectorAll('input:checked').forEach(function(i){i.checked=false});render();
});
render();

var modal=document.getElementById('modal'),modalBody=document.getElementById('modalBody');
function openModal(html){modalBody.innerHTML=html;modal.classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){modal.classList.remove('open');document.body.style.overflow=''}
document.getElementById('modalX').addEventListener('click',closeModal);
modal.addEventListener('click',function(e){if(e.target===modal)closeModal()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
function descHTML(mdl){var d=DEMO_SPECS[mdl];if(!d||!d.desc)return '<h3>Описание</h3><p style="color:#7b828e;font-size:14px">Описание для модели '+mdl+' пока не заполнено.</p>';
  return '<h3>Описание</h3>'+d.desc.map(function(x){return '<p>'+x+'</p>'}).join('')}
function specHTML(mdl){var d=DEMO_SPECS[mdl];if(!d||!d.tech)return '<h3>Технические характеристики</h3><p style="color:#7b828e;font-size:14px">Характеристики для модели '+mdl+' пока не заполнены.</p>';
  return '<h3>Технические характеристики</h3>'+d.tech.map(function(g){return '<h4>'+g[0]+'</h4><ul>'+g[1].map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'}).join('')}
function kitHTML(mdl){var d=DEMO_SPECS[mdl];if(!d||!d.kit)return '<h3>Комплектация</h3><p style="color:#7b828e;font-size:14px">Комплектация для модели '+mdl+' пока не заполнена.</p>';
  return '<h3>Комплектация</h3><ul>'+d.kit.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'}
grid.addEventListener('click',function(e){
  var s=e.target.closest('[data-spec]'),k=e.target.closest('[data-kit]');
  var dsc=e.target.closest('[data-desc]');
  if(dsc){openModal(descHTML(dsc.getAttribute('data-desc')))}
  else if(s){openModal(specHTML(s.getAttribute('data-spec')))}
  else if(k){openModal(kitHTML(k.getAttribute('data-kit')))}
});
</script>
